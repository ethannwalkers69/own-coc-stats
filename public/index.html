<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clash Stats</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="assets/js/tailwind-config.js"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
  <script src="assets/js/app.js" defer></script>
</head>
<body class="bg-ink-950 text-zinc-200 font-sans antialiased">
  <!-- Mobile top bar -->
  <header class="lg:hidden sticky top-0 z-30 flex items-center justify-between px-4 h-14 bg-ink-900/95 backdrop-blur border-b border-white/5">
    <button id="menuBtn" class="p-2 -ml-2 rounded-lg hover:bg-white/5" aria-label="Open menu"><i data-lucide="menu"></i></button>
    <span class="font-bold tracking-wide text-gold-400">CLASH STATS</span>
    <button class="refreshBtn p-2 -mr-2 rounded-lg hover:bg-white/5" aria-label="Refresh"><i data-lucide="refresh-cw"></i></button>
  </header>
  <div id="backdrop" class="fixed inset-0 z-40 bg-black/60 hidden lg:hidden"></div>

  <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-64 -translate-x-full lg:translate-x-0 transition-transform duration-200 bg-ink-900 border-r border-white/5 flex flex-col">
    <div class="h-16 flex items-center gap-3 px-5 border-b border-white/5">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-gold-400 to-orange-600 flex items-center justify-center text-black"><i data-lucide="trophy" class="w-5 h-5"></i></div>
      <div><div class="font-extrabold tracking-wide text-gold-400 leading-none">CLASH STATS</div><div class="text-[11px] text-zinc-500 mt-1">Personal dashboard</div></div>
    </div>
    <nav id="nav" class="flex-1 overflow-y-auto p-3 space-y-1"></nav>
    <div class="p-4 text-[11px] text-zinc-600 border-t border-white/5">Not affiliated with Supercell.</div>
  </aside>

  <main class="lg:ml-64 min-h-screen">
    <div class="max-w-6xl mx-auto p-4 sm:p-6 lg:p-8">
      <div id="banner"></div>
      <div id="view"></div>
    </div>
  </main>
  <div id="toasts" class="fixed bottom-4 right-4 z-[60] space-y-2"></div>
</body>
</html>
